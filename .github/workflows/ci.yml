name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # No encoder, no torch, no model download: the suite substitutes a
    # deterministic fake (tests/conftest.py), which is what keeps it offline.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy gateway
      - run: pytest -q

  ann-backends:
    # The ANN index backends are skipped when hnswlib and faiss are absent, so
    # one job installs them and runs the index suite for real.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev,ann]"
      - run: pytest tests/test_index.py -q

  guard:
    # The guard is lexical, so what it catches can be measured in CI without a
    # model. A regression here is a regression in wrong answers served.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m benchmarks.guard_eval --min-catch 22 --max-false-veto 0
