[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vector-cache-gateway"
version = "0.3.0"
description = "A semantic cache in front of a local vector store, with a measured similarity threshold and a guard against the hits it cannot measure away."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

# numpy only. The cache takes anything with an `encode(text) -> ndarray`, so the
# encoder is an extra rather than a dependency -- which also keeps the test
# suite installable without torch, since it substitutes a fake encoder anyway.
dependencies = [
    "numpy>=1.26,<3.0",
]

[project.optional-dependencies]
encoder = [
    "sentence-transformers>=2.7,<3.0",
]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.6",
    "mypy>=1.11",
]
bench = [
    "matplotlib>=3.8",
]
# Approximate nearest neighbour backends, for caches past the size where a full
# scan is cheap. See benchmarks/bench_ann.py for what they cost in recall.
ann = [
    "hnswlib>=0.8",
    "faiss-cpu>=1.8",
]
# Only for examples/fastapi_proxy.py.
serve = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[tool.setuptools]
packages = ["gateway"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# Deliberately not pinned to a python_version. Pinning it to "3.10" makes mypy
# read numpy's modern stubs under 3.10 rules and reject their PEP 695 `type`
# statements, so the check fails on 3.13 and 3.14 while passing on 3.10. The CI
# matrix runs mypy on every supported version instead, which covers the same
# ground without a pin that only works on the oldest one.
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
